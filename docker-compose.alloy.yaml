services:
  postgres:
    image: postgres:16-bookworm
    network_mode: host
    environment:
      POSTGRES_USER: campusos
      POSTGRES_PASSWORD: campusos
      POSTGRES_DB: campusos
      PGPORT: "5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U campusos -d campusos -h 127.0.0.1 -p 5432"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s
    restart: unless-stopped

  # M19-W3 — automated pg_dump backups (O-3): custom-format dump on start
  # and every 24h into the pgbackups named volume, 14-day rotation. The same
  # postgres image guarantees a matching pg_dump version. Restore drill:
  # scripts/backup/restore-verify.sh (see docs/OPERATIONS.md §28).
  backup:
    image: postgres:16-bookworm
    network_mode: host
    environment:
      PGHOST: 127.0.0.1
      PGPORT: "5432"
      PGUSER: campusos
      PGPASSWORD: campusos
      PGDATABASE: campusos
      BACKUP_DIR: /var/backups/campusos
      RETENTION_DAYS: "14"
      BACKUP_INTERVAL_SECONDS: "86400"
    volumes:
      - ./scripts/backup:/scripts:ro
      - pgbackups:/var/backups/campusos
    depends_on:
      postgres:
        condition: service_healthy
    command: bash /scripts/backup-loop.sh
    restart: unless-stopped

  api:
    image: node:22-bookworm
    working_dir: /workspace
    network_mode: host
    volumes:
      - .:/workspace
      - api_node_modules_cache:/workspace/.docker-cache
      # Read-only view of backups for /health/ops freshness reporting.
      - pgbackups:/var/backups/campusos:ro
    environment:
      DATABASE_URL: postgresql://campusos:campusos@127.0.0.1:5432/campusos
      API_PORT: "4000"
      SEED_DEMO: "true"
      BACKUP_DIR: /var/backups/campusos
      IS_ALLOY: ${IS_ALLOY:-false}
      NPM_CONFIG_FUND: "false"
      NPM_CONFIG_AUDIT: "false"
    env_file:
      - apps/api/.env
    depends_on:
      postgres:
        condition: service_healthy
    command: >
      bash -lc "
        npm install &&
        npm run build:shared &&
        npm run prisma:generate &&
        npm run prisma:deploy &&
        npm run db:seed &&
        npm run dev:api
      "
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - fetch('http://127.0.0.1:4000/api/v1/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))
      interval: 10s
      timeout: 5s
      retries: 60
      start_period: 60s
    restart: unless-stopped

  web:
    image: node:22-bookworm
    working_dir: /workspace
    network_mode: host
    volumes:
      - .:/workspace
    environment:
      API_INTERNAL_URL: http://127.0.0.1:4000
      NEXT_TELEMETRY_DISABLED: "1"
      NPM_CONFIG_FUND: "false"
      NPM_CONFIG_AUDIT: "false"
    depends_on:
      postgres:
        condition: service_healthy
    command: >
      bash -lc "
        until [ -d node_modules/next ] && [ -d packages/shared/dist ]; do
          echo 'web: waiting for api service to finish npm install + shared build...';
          sleep 5;
        done;
        npm run dev:web
      "
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - fetch('http://127.0.0.1:3000/login').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))
      interval: 10s
      timeout: 5s
      retries: 60
      start_period: 90s
    restart: unless-stopped

volumes:
  pgdata:
  pgbackups:
  api_node_modules_cache:
