services:
  site:
    image: node:22-bookworm-slim
    working_dir: /workspace
    network_mode: host
    volumes:
      - .:/workspace
    environment:
      PORT: "3000"
      IS_ALLOY: ${IS_ALLOY:-true}
    command: node server.mjs
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - fetch('http://127.0.0.1:3000/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    restart: unless-stopped
